# Painel React — sem backend, sem banco. Só nginx/Vite + proxy para a API.
#
# Pré-requisito: API do radar-ofertas-backend acessível (padrão :3001 no host).
#
#   cp .env.example .env
#   docker compose up -d --build              # produção (:3000)
#   docker compose --profile dev up -d        # Vite HMR (:5173)
#
# API na mesma rede Docker que o backend: copie docker-compose.backend-network.yml.example

name: radar-ofertas-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: radar-ofertas-frontend:prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_PROXY_UPSTREAM: ${API_PROXY_UPSTREAM:-host.docker.internal:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  frontend-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: radar-ofertas-frontend:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_DEV_HOST: "0.0.0.0"
      VITE_DEV_PORT: "5173"
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
      VITE_DEV_API_PROXY_TARGET: ${VITE_DEV_API_PROXY_TARGET:-http://host.docker.internal:3001}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${VITE_DEV_PORT:-5173}:5173"

volumes:
  frontend_node_modules:
